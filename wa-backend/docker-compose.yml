services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wa_center
      POSTGRES_USER: wa_user
      POSTGRES_PASSWORD: wa_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa_user -d wa_center"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Port AMQP untuk koneksi dari aplikasi Golang Anda
      - "15672:15672" # Port HTTP untuk akses Dashboard UI di Browser
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # Menyimpan data antrean agar tidak hilang saat mati
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  rabbitmq_data: # Daftarkan volume baru untuk RabbitMQ
